<title>Rimo Chat はじめてガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#FAF8F5;
    --surface:#FFFFFF;
    --surface-2:#F3EEE7;
    --surface-3:#EFE7DC;
    --border:#E7DFD3;
    --text:#221D16;
    --text-muted:#756B5C;
    --text-faint:#A69C8C;
    --accent:#DD5B2E;
    --accent-strong:#B5461F;
    --accent-soft:#FBE7DA;
    --accent-soft-2:#F6DCC9;
    --ok:#2F7A5E;
    --ok-soft:#E1F0E8;
    --warn:#B5461F;
    --warn-soft:#FBE7DA;
    --shadow: 0 1px 2px rgba(34,29,22,.04), 0 8px 24px -12px rgba(34,29,22,.12);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --font-head: "Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;
    --font-body: "Noto Sans JP","Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#18140F;
      --surface:#221D17;
      --surface-2:#2A241C;
      --surface-3:#332B21;
      --border:#3D362B;
      --text:#F3ECE1;
      --text-muted:#B6AA97;
      --text-faint:#8A7F6E;
      --accent:#F0794C;
      --accent-strong:#FF9868;
      --accent-soft:#3A2418;
      --accent-soft-2:#452A1A;
      --ok:#6FC8A0;
      --ok-soft:#1E3229;
      --warn:#F0794C;
      --warn-soft:#3A2418;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#18140F;
    --surface:#221D17;
    --surface-2:#2A241C;
    --surface-3:#332B21;
    --border:#3D362B;
    --text:#F3ECE1;
    --text-muted:#B6AA97;
    --text-faint:#8A7F6E;
    --accent:#F0794C;
    --accent-strong:#FF9868;
    --accent-soft:#3A2418;
    --accent-soft-2:#452A1A;
    --ok:#6FC8A0;
    --ok-soft:#1E3229;
    --warn:#F0794C;
    --warn-soft:#3A2418;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.disp{ font-family:var(--font-head); text-wrap:balance; letter-spacing:.01em; }
  a{ color:var(--accent); }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }

  .app{ display:flex; flex-direction:column; min-height:100vh; }

  /* ---------- Header ---------- */
  .hd{
    position:sticky; top:0; z-index:30;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .hd-row{
    display:flex; align-items:center; gap:18px;
    max-width:1180px; margin:0 auto; padding:13px 24px;
  }
  .brand{ display:flex; align-items:center; gap:10px; flex-shrink:0; cursor:pointer; }
  .brand-mark{
    width:34px; height:34px; border-radius:10px; flex-shrink:0;
    background:linear-gradient(155deg, var(--accent), var(--accent-strong));
    display:flex; align-items:center; justify-content:center; color:#fff;
    box-shadow: var(--shadow);
  }
  .brand-mark svg{ width:18px; height:18px; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.25; }
  .brand-text b{ font-family:var(--font-head); font-weight:700; font-size:15px; }
  .brand-text span{ font-size:11.5px; color:var(--text-muted); }

  .hd-progress{ flex:1; display:flex; align-items:center; gap:10px; min-width:0; max-width:340px; }
  .bar-track{ flex:1; height:6px; border-radius:99px; background:var(--surface-3); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:99px; background:linear-gradient(90deg, var(--accent), var(--accent-strong)); transition:width .4s ease; }
  .hd-progress small{ font-size:11.5px; color:var(--text-muted); white-space:nowrap; font-variant-numeric:tabular-nums; }

  .hd-nav{ display:flex; align-items:center; gap:6px; margin-left:auto; flex-shrink:0; }
  .hd-btn{
    display:flex; align-items:center; gap:6px;
    padding:8px 12px; border-radius:99px; border:1px solid transparent;
    background:transparent; color:var(--text-muted); font-size:13px; font-weight:500;
    cursor:pointer; white-space:nowrap; text-decoration:none;
  }
  .hd-btn:hover{ background:var(--surface-2); color:var(--text); }
  .hd-btn.primary{ background:var(--surface-2); border-color:var(--border); color:var(--text); }
  .hd-btn svg{ width:15px; height:15px; }
  @media (max-width: 860px){ .hd-btn .txt{ display:none; } .hd-progress{ display:none; } }

  /* ---------- Layout ---------- */
  .shell{ flex:1; display:flex; max-width:1180px; margin:0 auto; width:100%; align-items:flex-start; }
  .sidebar{
    width:250px; flex-shrink:0; padding:28px 14px 60px;
    position:sticky; top:61px; align-self:flex-start;
    max-height:calc(100vh - 61px); overflow-y:auto;
  }
  .side-item{
    display:flex; align-items:center; gap:11px; width:100%;
    padding:9px 12px; border-radius:var(--radius-sm); border:none; background:transparent;
    text-align:left; cursor:pointer; color:var(--text-muted); margin-bottom:2px;
  }
  .side-item:hover{ background:var(--surface-2); color:var(--text); }
  .side-item.active{ background:var(--accent-soft); color:var(--accent-strong); }
  .side-num{
    width:24px; height:24px; border-radius:50%; flex-shrink:0;
    background:var(--surface-3); color:var(--text-muted);
    display:flex; align-items:center; justify-content:center;
    font-size:11.5px; font-weight:700; font-family:var(--font-head);
  }
  .side-item.active .side-num{ background:var(--accent); color:#fff; }
  .side-item.done .side-num{ background:var(--ok); color:#fff; }
  .side-item.done .side-num svg{ width:13px; height:13px; }
  .side-label{ display:flex; flex-direction:column; min-width:0; }
  .side-label b{ font-size:13.5px; font-weight:600; line-height:1.3; }
  .side-label span{ font-size:11px; color:var(--text-faint); line-height:1.3; }
  .side-item.active .side-label span{ color:var(--accent-strong); opacity:.8; }
  .side-div{ height:1px; background:var(--border); margin:12px 6px; }
  @media (max-width: 900px){ .sidebar{ display:none; } }

  .main{ flex:1; min-width:0; padding:44px 32px 120px; }
  .view{ max-width:700px; margin:0 auto; animation:rise .35s ease both; }
  @media (prefers-reduced-motion: reduce){ .view{ animation:none; } }
  @keyframes rise{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none; } }

  .eyebrow{
    display:inline-flex; align-items:center; gap:7px;
    font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--accent-strong);
    text-transform:uppercase; margin-bottom:14px; font-family:var(--font-head);
  }
  .h-title{ font-size:30px; font-weight:900; line-height:1.4; margin:0 0 14px; }
  .h-desc{ font-size:15px; color:var(--text-muted); max-width:60ch; margin:0 0 22px; }

  .badges{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px; }
  .badge{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--surface-2); border:1px solid var(--border); color:var(--text-muted);
    padding:6px 12px; border-radius:99px; font-size:12.5px; font-weight:500;
  }
  .badge svg{ width:13px; height:13px; }
  .badge.accent{ background:var(--accent-soft); border-color:transparent; color:var(--accent-strong); }

  .cta{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--accent); color:#fff; border:none;
    padding:13px 22px; border-radius:99px; font-size:15px; font-weight:700;
    cursor:pointer; box-shadow:var(--shadow); font-family:var(--font-head);
  }
  .cta:hover{ background:var(--accent-strong); }
  .cta svg{ width:16px; height:16px; }
  .cta.ghost{ background:transparent; color:var(--text); border:1px solid var(--border); box-shadow:none; }
  .cta.ghost:hover{ background:var(--surface-2); }

  /* welcome step list */
  .step-list{ display:flex; flex-direction:column; gap:10px; margin-top:32px; }
  .step-row{
    display:flex; align-items:center; gap:16px; padding:16px 18px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
    cursor:pointer; text-align:left; width:100%;
  }
  .step-row:hover{ border-color:var(--accent); }
  .step-row .side-num{ width:32px; height:32px; font-size:13px; }
  .step-row .txt{ flex:1; min-width:0; }
  .step-row .txt b{ font-size:15px; display:block; }
  .step-row .txt span{ font-size:12.5px; color:var(--text-muted); }
  .step-row > svg{ width:17px; height:17px; color:var(--text-faint); flex-shrink:0; }

  /* section card (numbered sub-step) */
  .sec{ margin:34px 0; }
  .sec-head{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .sec-tag{
    font-family:var(--font-head); font-weight:900; font-size:12.5px; color:#fff;
    background:var(--accent); border-radius:7px; padding:3px 9px; flex-shrink:0;
  }
  .sec h3{ font-size:17.5px; font-weight:700; margin:0; }
  .sec p{ font-size:14.5px; color:var(--text-muted); margin:0 0 14px; }
  .sec p b{ color:var(--text); font-weight:600; }

  .path-cards{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:22px 0; }
  @media (max-width:560px){ .path-cards{ grid-template-columns:1fr; } }
  .path-card{
    display:flex; align-items:center; gap:12px; padding:15px 16px;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-md);
  }
  a.path-card{ text-decoration:none; color:inherit; transition:border-color .15s; }
  a.path-card:hover{ border-color:var(--accent); }
  .path-card .ic-wrap{
    width:36px; height:36px; border-radius:10px; background:var(--surface); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:var(--accent); border:1px solid var(--border);
  }
  .path-card b{ font-size:13.5px; display:block; }
  .path-card span{ font-size:12px; color:var(--text-muted); }

  /* real screenshot frame */
  .shot{ border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; background:var(--surface); box-shadow:var(--shadow); margin:14px 0 18px; }
  .shot img{ display:block; width:100%; height:auto; }
  .shot-cap{ padding:9px 14px; font-size:12px; color:var(--text-faint); border-top:1px solid var(--border); background:var(--surface-2); }
  .shot-row{ display:flex; gap:12px; flex-wrap:wrap; margin:14px 0 18px; }
  .shot-row .shot{ flex:1; min-width:200px; margin:0; }
  .shot-row .shot img{ height:100%; object-fit:cover; }

  /* service directory list (factual reference, not a screenshot) */
  .svc-card{ border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface); padding:4px 14px; margin:14px 0 18px; }
  .svc-group-label{ font-size:11.5px; font-weight:700; color:var(--text-faint); margin:14px 2px 4px; letter-spacing:.04em; }
  .svc-row{ display:flex; align-items:center; gap:12px; padding:10px 2px; }
  .svc-row + .svc-row{ border-top:1px solid var(--border); }
  .svc-row .dot-ic{ width:26px; height:26px; border-radius:7px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .svc-row .dot-ic svg{ width:14px; height:14px; }
  .svc-row .svc-name{ font-size:13px; font-weight:700; }
  .svc-row .svc-desc{ font-size:11.5px; color:var(--text-faint); }

  /* callouts */
  .tip{ display:flex; gap:11px; padding:14px 16px; border-radius:var(--radius-md); font-size:13.5px; margin:16px 0; }
  .tip svg{ width:17px; height:17px; flex-shrink:0; margin-top:1px; }
  .tip.info{ background:var(--accent-soft); color:var(--accent-strong); }
  .tip.warn{ background:var(--warn-soft); color:var(--warn); }
  .tip.ok{ background:var(--ok-soft); color:var(--ok); }
  .tip b{ display:block; margin-bottom:2px; }
  .tip .body{ color:var(--text); opacity:.92; }
  .tip a{ color:inherit; text-decoration:underline; }

  .more-box{
    display:flex; align-items:center; gap:14px; padding:16px 18px; margin:30px 0 6px;
    background:var(--surface-2); border:1px dashed var(--border); border-radius:var(--radius-md);
  }
  .more-box .dot-ic{ width:34px; height:34px; border-radius:10px; background:var(--accent-soft); color:var(--accent-strong); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .more-box b{ font-size:13.5px; display:block; }
  .more-box span{ font-size:12px; color:var(--text-muted); }
  .more-box a{ margin-left:auto; flex-shrink:0; }

  .help-box{ margin:34px 0 0; padding-top:22px; border-top:1px solid var(--border); }
  .help-box .lbl{ font-size:12px; font-weight:700; color:var(--text-faint); margin-bottom:10px; letter-spacing:.03em; }
  .help-box a{ display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text); text-decoration:none; padding:7px 0; }
  .help-box a:hover{ color:var(--accent-strong); }
  .help-box a svg{ width:13px; height:13px; color:var(--text-faint); flex-shrink:0; }

  .nav-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:44px; padding-top:22px; border-top:1px solid var(--border); }
  .nav-foot .cta{ padding:11px 20px; font-size:14px; }

  /* accordion (tips / trouble pages) */
  .acc{ border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface); margin-bottom:10px; overflow:hidden; }
  .acc-h{ display:flex; align-items:center; gap:12px; width:100%; padding:16px 18px; background:none; border:none; text-align:left; cursor:pointer; font-size:14.5px; font-weight:700; color:var(--text); }
  .acc-h .dot-ic{ width:28px; height:28px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .acc-h svg.chev{ margin-left:auto; width:16px; height:16px; color:var(--text-faint); transition:transform .2s; flex-shrink:0; }
  .acc.open .acc-h svg.chev{ transform:rotate(90deg); }
  .acc-body{ display:none; padding:0 18px 18px 58px; font-size:13.5px; color:var(--text-muted); }
  .acc-body p{ margin:0 0 10px; }
  .acc-body p:last-child{ margin-bottom:0; }
  .acc.open .acc-body{ display:block; }
  .admin-note{ margin:10px 0; padding:11px 14px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); font-size:12.5px; line-height:1.7; }
  .admin-note b{ display:block; color:var(--accent-strong); font-size:11.5px; font-weight:700; letter-spacing:.03em; margin-bottom:5px; }
  .admin-note ol{ margin:6px 0; padding-left:19px; }
  .admin-note li{ margin-bottom:4px; }
  .admin-note li:last-child{ margin-bottom:0; }
  .admin-note a{ text-decoration:underline; }
  .admin-note strong{ color:var(--text); font-weight:700; }

  .case-card{ border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; margin-bottom:14px; background:var(--surface); }
  .case-card .shot{ margin:0; border:none; border-radius:0; box-shadow:none; border-bottom:1px solid var(--border); }
  .case-card .case-body{ padding:16px 20px; }
  .case-card .k{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color:var(--accent-strong); background:var(--accent-soft); padding:3px 10px; border-radius:99px; margin-bottom:9px; }
  .case-card h4{ margin:0 0 7px; font-size:15px; }
  .case-card p{ margin:0; font-size:13.5px; color:var(--text-muted); }

  .complete-check{ width:64px; height:64px; border-radius:50%; background:var(--ok-soft); color:var(--ok); display:flex; align-items:center; justify-content:center; margin-bottom:18px; }
  .complete-check svg{ width:32px; height:32px; }
  .recap{ display:flex; flex-direction:column; gap:8px; margin:26px 0; }
  .recap-row{ display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--surface-2); border-radius:var(--radius-sm); }
  .recap-row .side-num{ background:var(--ok); color:#fff; width:22px; height:22px; }
  .recap-row .side-num svg{ width:12px; height:12px; }
  .recap-row span{ font-size:13.5px; font-weight:600; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:99px; }
</style>

<div class="app">
  <header class="hd">
    <div class="hd-row">
      <div class="brand" onclick="go('welcome')">
        <div class="brand-mark">${''}</div>
        <div class="brand-text"><b>Rimo Chat</b><span>はじめてガイド</span></div>
      </div>
      <div class="hd-progress">
        <div class="bar-track"><div class="bar-fill" id="barFill" style="width:0%"></div></div>
        <small id="barText">0/5 完了</small>
      </div>
      <nav class="hd-nav">
        <button class="hd-btn" onclick="go('tips')"><span class="ic-slot" data-ic="bulb"></span><span class="txt">活用事例</span></button>
        <button class="hd-btn" onclick="go('trouble')"><span class="ic-slot" data-ic="alert"></span><span class="txt">困ったときは</span></button>
        <a class="hd-btn primary" href="https://guide.rimo.app/ja/collections/17521170-rimo-actions" target="_blank" rel="noopener"><span class="ic-slot" data-ic="external"></span><span class="txt">ヘルプセンター</span></a>
      </nav>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main"><div class="view" id="view"></div></main>
  </div>
</div>

<script>
/* ---------------- icons ---------------- */

  share2:'<circle cx="18" cy="5.5" r="2.8"/><circle cx="6" cy="12" r="2.8"/><circle cx="18" cy="18.5" r="2.8"/><line x1="8.4" y1="10.6" x2="15.6" y2="7"/><line x1="8.4" y1="13.4" x2="15.6" y2="17"/>',

  arrowRight:'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="13 5 19 12 13 19"/>',
  external:'<path d="M17.5 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/><polyline points="14.5 3 20.5 3 20.5 9"/><line x1="10.5" y1="13" x2="20.5" y2="3"/>',

function helpBox(items){

}

  {q:'【Microsoft】Outlook・Teams・OneDriveなどと連携しようとすると、管理者の承認が必要と表示される／ブロックされる', a:'これはRimo側の不具合ではなく、組織のMicrosoft 365（Entra ID）テナントに設定されているセキュリティポリシーによるものです。ユーザーが自分の判断で外部アプリにメール・カレンダー・ファイルへのアクセス許可を与えられないよう、管理者の承認を必須にしている組織があります。<br><br>次のような表示が出たら、この状態に該当します。<br>・「Need admin approval（管理者の承認が必要です）」<br>・「AADSTS90094: An administrator of ○○ has set a policy that prevents you from granting ○○ the permissions it is requesting.（組織の管理者が、このアプリへの許可付与を禁止するポリシーを設定しています）」<br>・「AADSTS65001: The user or administrator has not consented to use the application…」<br><br>画面に「リクエストを送信」のようなボタンがあれば押してください。社内のMicrosoft 365管理者に承認依頼が届きます。ボタンがなく案内だけの場合は、承認依頼の仕組み自体が組織で無効なので、IT管理者に直接依頼してください。<div class="admin-note"><b>管理者の方へ①：いちばん手軽な方法</b>管理者アカウント自身でRimoにログインし、同じ連携ボタンを押してください。同意画面に表示される「<strong>組織の代理として同意する（Consent on behalf of your organization）</strong>」のチェックボックスをオンにして承認すれば、その場で組織全体に対して許可できます。<br><br><b>管理者の方へ②：ユーザーから承認リクエストが届いている場合</b><ol><li>Cloud Application Administrator以上の権限で<a href="https://entra.microsoft.com" target="_blank" rel="noopener">Microsoft Entra 管理センター</a>にサインイン。</li><li>「エンタープライズ アプリケーション」→「アクティビティ」→「管理者の同意の要求」を開く。</li><li>「My Pending（自分宛の保留中）」タブで該当リクエストを開き、権限を確認して承認する。</li></ol>対応できるのは、自分がレビュアーに指定された後に作成されたリクエストのみです。<br><br><b>管理者の方へ③：管理センターから直接許可する場合</b><ol><li>「エンタープライズ アプリケーション」を開き、<strong>「アプリケーションの種類」を「すべてのアプリケーション」に変更</strong>してから検索する（既定の絞り込みのままだと表示されないことがあります）。</li><li>該当アプリを開き「セキュリティ」→「アクセス許可」で要求内容を確認して「管理者の同意を付与」をクリック。</li></ol>検索しても見つからない場合は、まだテナントにアプリが登録されていません。対象ユーザーに一度連携を試してもらってから再検索するか、連携ボタンを押した際に遷移するサインイン画面のアドレスバーに含まれる<strong>client_id</strong>の値（＝アプリケーションID。Microsoftのトラブルシュート手順でもこの方法が案内されています）を控え、その値で検索してください。<br><br><b>代替策：組織全体の同意ポリシー自体を緩める</b>低リスクな権限であればユーザー自身の判断で同意できるようにしたい場合は、「エンタープライズ アプリケーション」→「同意と許可」→「ユーザーの同意の設定」を、「検証済み発行元のアプリ、かつ低リスクの権限に限り、ユーザーの同意を許可」に変更します（対象権限を事前に「権限の分類」で低リスクに指定する必要あり）。Rimoに限らず全アプリに影響するため、個別許可より慎重な検討が必要です。</div><br>詳しくはMicrosoft公式の<a href="https://learn.microsoft.com/en-us/entra/identity/enterprise-apps/user-admin-consent-overview" target="_blank" rel="noopener">User and admin consent overview ↗</a>および<a href="https://learn.microsoft.com/ja-jp/troubleshoot/entra/entra-id/app-integration/troubleshoot-consent-issues" target="_blank" rel="noopener">同意に関する問題のトラブルシューティング ↗</a>をご覧ください。'},
  {q:'【Microsoft】管理者が承認したはずなのに、まだ連携できない', a:'承認が済んでいるのに連携できない場合、次の4つが典型的な原因です。<div class="admin-note"><b>1. ユーザーの割り当てが必要になっている</b>「エンタープライズ アプリケーション」→該当アプリ→「プロパティ」で「ユーザーの割り当てが必要ですか？」が「はい」になっていると、組織全体に同意していても、割り当てられたユーザーしか利用できません。「ユーザーとグループ」から対象者を割り当ててください。<br><br><b>2. 一部の権限しか同意されていない</b>「セキュリティ」→「アクセス許可」を開き、サインイン時に要求されるスコープがすべて並んでいるかを確認してください。後から要求権限が増えた場合、再度「管理者の同意を付与」が必要です。<br><br><b>3. 別のアプリに同意している</b>名前が似た別アプリに同意しているケースがあります。アプリケーションID（client_id）が一致しているかを確認してください。<br><br><b>4. 条件付きアクセスでブロックされている</b>同意とは別の仕組みです。「Entra ID」→「監視」→「サインイン ログ」で該当ユーザーのサインインを開き、エラーコードと「条件付きアクセス」タブの評価結果を確認してください。未管理デバイスや社外ネットワークからのアクセス制限が原因のことがあります。</div>'},
  {q:'【Google】Gmail・カレンダー・Driveなどと連携しようとすると、ブロックされる／エラーが出る', a:'Microsoftと同様に、Google Workspaceの組織でも管理者が許可していない外部アプリからのデータアクセスを制限していることがあります。連携時に「このアプリはブロックされています」「組織のセキュリティポリシーによりアクセスがブロックされました」といった趣旨の画面が出た場合、Rimoがその組織で許可されていない状態です。<br><br>Microsoftと異なり、Google側にはユーザー自身が承認をリクエストする画面は基本的になく、その場でIT管理者に直接連携の許可を依頼する必要があります。<div class="admin-note"><b>管理者の方へ</b><ol><li><a href="https://admin.google.com" target="_blank" rel="noopener">Google管理コンソール</a>に管理者権限でサインインする。</li><li>「セキュリティ」→「アクセスとデータ管理」→「APIの制御」→「アプリへのアクセスを管理」を開く。</li><li>一覧に「Rimo」が表示されていれば、その行にカーソルを合わせて「アクセスを変更」をクリック。表示されていなければ「新しいアプリを設定」からアプリ名またはOAuthクライアントIDで検索する。</li><li>許可する組織部門（全体、または特定の部署のみ）を選択する。</li><li>アクセスレベルで「信頼できる」を選択して保存する。</li></ol>反映まで数分〜最大24時間かかる場合があります。</div><br>詳しくはGoogle公式の<a href="https://support.google.com/a/answer/7281227" target="_blank" rel="noopener">サードパーティアプリと内部アプリによるGoogle Workspaceデータへのアクセスを管理する ↗</a>をご覧ください。'},
  {q:'共有リンクの相手がタスクを実行できない', a:'仕様上、組織外のユーザーはタスクの閲覧のみ可能で、実行はできません。実行するには、組織内のアカウントでログインする必要があります。'},
  {q:'テンプレートを作ったのに自動実行されない', a:'「タスク作成と同時に実行」がオンになっているか、設定した条件（チームフォルダ・作成者）が対象の会議に一致しているかを確認してください。'},
  {q:'テンプレートを作成する権限がない', a:'タスクテンプレートの作成・編集は特権管理者・管理者のみに限られています。組織の管理者に作成を依頼してください。'},
];
VIEWS.trouble = () => `
  <div class="eyebrow">${ic('alert',14)}RIMO CHAT トラブルシュート</div>
  <h1 class="h-title">困ったときは</h1>
  <p class="h-desc">よくいただくご質問と対処方法をまとめました。当てはまるものを開いて確認してください。</p>
  <div id="faqList">
    ${FAQ.map((f,i)=>`
      <div class="acc" id="faq-${i}">
        <button class="acc-h" onclick="toggleAcc(${i})">${dotIc('alert','var(--warn-soft)','var(--warn)')}<span>${f.q}</span>${ic('chevRight',16,'chev')}</button>
        <div class="acc-body"><p>${f.a}</p></div>
      </div>`).join('')}
  </div>
  <p style="font-size:12.5px;color:var(--text-faint);margin-top:22px;">上記で解決しない場合は、<a href="${HELP.collection}" target="_blank" rel="noopener">ヘルプセンター ↗</a>で検索いただくか、担当者までお気軽にお問い合わせください。該当ノートのURLを添えていただくとスムーズです。</p>
`;

/* ---------------- router / state ---------------- */
const ORDER = ['welcome', ...STEPS.map(s=>s.id), 'complete'];
/* Bump this whenever step content/order changes, so old readers' saved
   checkmarks (which no longer reflect what they actually saw) are cleared
   instead of silently showing as "done" against the new content. */
const GUIDE_VERSION = 'v9-rimo-naming-and-admin-note';
let progress = new Set();
try{
  const stored = JSON.parse(localStorage.getItem('rimoActionsGuideProgress')||'null');
  if(stored && stored.version === GUIDE_VERSION){ progress = new Set(stored.ids||[]); }
}catch(e){}
function saveProgress(){ try{ localStorage.setItem('rimoActionsGuideProgress', JSON.stringify({version:GUIDE_VERSION, ids:[...progress]})); }catch(e){} }

function renderSidebar(current){
  const items = [{id:'welcome', title:'ようこそ', icon:'home'}, ...STEPS, {id:'complete', title:'完了', icon:'flag'}];
  document.getElementById('sidebar').innerHTML = items.map((it,idx)=>{
    const done = progress.has(it.id);
    const active = it.id === current;
    return `<button class="side-item ${active?'active':''} ${done?'done':''}" onclick="go('${it.id}')">
      <span class="side-num">${done && !active ? ic('check',13) : (it.id==='welcome'?ic('home',13):(it.id==='complete'?ic('flag',13):idx))}</span>
      <span class="side-label"><b>${it.title}</b>${it.sub?`<span>${it.sub}</span>`:''}</span>
    </button>`;
  }).join('');
  const el = document.getElementById('sidebar');
  const btns = el.querySelectorAll('.side-item');
  if(btns.length){
    btns[0].insertAdjacentHTML('afterend', '<div class="side-div"></div>');
    btns[btns.length-1].insertAdjacentHTML('beforebegin', '<div class="side-div"></div>');
  }
}
function updateHeader(current){
  const doneSteps = STEPS.filter(s=>progress.has(s.id)).length;
  document.getElementById('barFill').style.width = (doneSteps/STEPS.length*100)+'%';
  document.getElementById('barText').textContent = `${doneSteps}/${STEPS.length} 完了`;
}
function go(id){
  if(!VIEWS[id]) id = 'welcome';
  if(STEPS.some(s=>s.id===id) || id==='complete'){ progress.add(id); saveProgress(); }
  try{ history.replaceState(null, '', '#'+id); }catch(e){}
  document.getElementById('view').innerHTML = VIEWS[id]();
  document.getElementById('view').style.animation='none'; void document.getElementById('view').offsetWidth; document.getElementById('view').style.animation='';
  renderSidebar(id);
  updateHeader(id);
  document.querySelector('.main').scrollTo({top:0,behavior:'instant'});
  window.scrollTo({top:0,behavior:'instant'});
}
function toggleAcc(i){
  document.getElementById('faq-'+i).classList.toggle('open');
}

/* header icon slots (nav buttons use data-ic so we can reuse ic()) */
document.querySelectorAll('.ic-slot').forEach(el=>{ el.outerHTML = ic(el.dataset.ic, 15); });
document.querySelector('.brand-mark').innerHTML = ic('zap', 18);

/* init */
const initial = (location.hash||'').replace('#','') || 'welcome';
go(VIEWS[initial] ? initial : 'welcome');
window.addEventListener('hashchange', ()=>{ const h=(location.hash||'').replace('#',''); if(VIEWS[h]) go(h); });
</script>
